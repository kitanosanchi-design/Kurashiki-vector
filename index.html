<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>共テ対策ベクトル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Noto+Serif+JP:wght@400;600&family=STIX+Two+Text:ital,wght@0,400;1,400&display=swap">
<style>
:root{
  --bg:#f4f6f7; --surface:#ffffff; --ink:#172126; --muted:#5d6f76; --line:#d5dee1;
  --teal:#0f6e78; --teal-soft:#e2f1f2; --orange:#c0571b; --orange-soft:#fbeee6;
  --red:#b8322a; --red-soft:#fbe9e7; --ok:#1f7a45; --ok-soft:#e3f3e9;
  --t1:#0f6e78; --t2:#3a67ad; --t3:#b8322a; --t4:#6a4c9c; --t5:#5a7a2c;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-prob:"Noto Serif JP","Hiragino Mincho ProN",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1619; --surface:#172226; --ink:#e3edf0; --muted:#93a8ae; --line:#2a3a3f;
  --teal:#4fb7c2; --teal-soft:#16353a; --orange:#f08a4b; --orange-soft:#3a2418;
  --red:#f07a6e; --red-soft:#3a1d1a; --ok:#5fcf8a; --ok-soft:#173326;
  --t1:#2f9aa5; --t2:#5584cc; --t3:#d0554a; --t4:#8466b8; --t5:#6f9440; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1619; --surface:#172226; --ink:#e3edf0; --muted:#93a8ae; --line:#2a3a3f;
  --teal:#4fb7c2; --teal-soft:#16353a; --orange:#f08a4b; --orange-soft:#3a2418;
  --red:#f07a6e; --red-soft:#3a1d1a; --ok:#5fcf8a; --ok-soft:#173326;
  --t1:#2f9aa5; --t2:#5584cc; --t3:#d0554a; --t4:#8466b8; --t5:#6f9440; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;margin:0;-webkit-text-size-adjust:100%}
.wrap{max-width:600px;margin:0 auto;padding:0 16px 90px}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;color:inherit}

.v{font-size:1.06em;display:inline-block;position:relative;font-family:"Latin Modern Roman","STIX Two Text","Times New Roman",serif;font-style:italic;line-height:1;padding-top:.42em;padding-right:.08em;margin:0 .03em}
.v::before{content:"";position:absolute;left:.06em;right:.12em;top:.17em;border-top:.065em solid currentColor}
.v::after{content:"";position:absolute;right:-.03em;top:.08em;border-left:.26em solid currentColor;border-top:.12em solid transparent;border-bottom:.12em solid transparent}
.i{font-size:1.06em;font-family:"Latin Modern Roman","STIX Two Text","Times New Roman",serif;font-style:italic;margin:0 .03em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.92em;line-height:1.15;margin:0 .12em}
.fr>span:first-child{border-bottom:.07em solid currentColor;padding:0 .18em .06em}
.fr>span:last-child{padding-top:.06em}
.mk{display:inline-block;border:1.3px solid currentColor;min-width:1.35em;text-align:center;font-family:"Noto Sans CJK JP","Hiragino Sans",sans-serif;font-weight:700;font-style:normal;font-size:.9em;line-height:1.35;padding:0 .18em;margin:0 .08em;vertical-align:.05em}
.nw{white-space:nowrap}
.fr .mk{margin:.06em .05em}


svg.fig{color:var(--ink)} svg.fig .ln{stroke:currentColor;fill:none} svg.fig .sub{stroke:var(--muted);fill:none}
svg.fig .dot{fill:currentColor} svg.fig .lab{fill:currentColor;font-family:"Latin Modern Roman","STIX Two Text","Times New Roman",serif;font-style:italic}
svg.fig .a1{stroke:var(--teal)} svg.fig .a1f{fill:var(--teal)} svg.fig .a1t{fill:var(--teal)}
svg.fig .a2{stroke:var(--orange)} svg.fig .a2f{fill:var(--orange)} svg.fig .a2t{fill:var(--orange)}
svg.fig .note{fill:var(--muted);font-family:"Noto Sans CJK JP","Hiragino Sans",sans-serif;font-style:normal}

svg.fig{max-width:100%;height:auto;display:block;margin:6px auto}

.bar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:12px}
.bar .back{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer}
.bar .ttl{font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sc{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}

.hero{padding:22px 0 6px}
.hero .eb{font-size:13px;letter-spacing:.14em;color:var(--red);font-weight:700}
.hero h1{font-size:32px;font-weight:900;line-height:1.2;margin-top:4px}
.hero p{color:var(--muted);margin:8px 0 0}
.who{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:16px 0;display:grid;gap:10px}
.who label{font-size:13px;color:var(--muted);display:block;margin-bottom:2px}
.who input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.row3{display:grid;grid-template-columns:4.4em 5em 1fr;gap:10px}
.lessons{display:grid;gap:12px}
.lcard{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;width:100%}
.lcard[disabled]{opacity:.45;cursor:default}
.lcard .no{grid-row:span 2;width:52px;height:52px;border-radius:14px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px;line-height:1;text-align:center}
.lcard .no small{display:block;font-size:10px;font-weight:700}
.lcard .tt{font-weight:700}
.lcard .st{font-size:13px;color:var(--muted)}

.goal{background:var(--teal-soft);border-left:5px solid var(--teal);border-radius:8px;padding:10px 12px;margin:4px 0 6px;font-weight:700}
.flow{display:flex;gap:3px;font-size:11px;margin-bottom:8px}.flow div{color:#fff;padding:2px 6px;border-radius:4px;flex:var(--w);white-space:nowrap;overflow:hidden}
.sec{margin-top:26px}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tag{color:#fff;font-weight:700;font-size:13px;padding:2px 12px;border-radius:999px;white-space:nowrap}
.sh h2{font-size:19px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.tool b{color:var(--teal)}
.q{margin-bottom:8px}
.lead{margin:0 0 10px}
.inrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:18px}
.inrow input{width:3.6em;font:inherit;font-size:17px;text-align:center;padding:6px 4px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.inrow .pl{color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{border:1.5px solid var(--teal);background:var(--teal);color:#fff;border-radius:999px;padding:7px 18px;cursor:pointer;font-weight:700}
.btn.ghost{background:transparent;color:var(--teal)}
.btn.red{border-color:var(--red);background:var(--red)}
.btn[disabled]{opacity:.4;cursor:default}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;margin-top:6px;cursor:pointer}
.opt.sel{border-color:var(--teal);background:var(--teal-soft)}
.fb{margin-top:8px;font-size:15px;border-radius:8px;padding:6px 10px;display:none}
.fb.ok{display:block;background:var(--ok-soft);color:var(--ok)}
.fb.ng{display:block;background:var(--orange-soft);color:var(--orange)}
.fb .ex{color:var(--ink);margin-top:4px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.signs{background:var(--orange-soft);border-radius:12px;padding:10px 14px}
.signs ol{margin:4px 0 0;padding-left:1.3em}

.prob{font-family:var(--f-prob);line-height:2}
.prob .eq{text-align:center}
.talk p{margin:4px 0;display:flex}.talk p b{flex:0 0 3em;font-family:var(--f-body)}.talk p span.say{flex:1}
.part{margin-top:12px}
.part>b{font-family:var(--f-body);margin-right:4px}
.gun{border:1px solid var(--ink);padding:6px 10px;margin:8px 0;font-size:15px;font-family:var(--f-prob)}
.gun .h{font-family:var(--f-body);font-size:12px}
.gun div.o{padding:2px 0}
.ms{margin:8px 0 4px;display:grid;gap:6px}
.mrow{display:flex;align-items:center;gap:3px;flex-wrap:wrap}
.mrow .mk{margin-right:4px}
.mrow .mk{font-size:15px;min-width:1.9em}
.bub{width:26px;height:26px;flex:0 0 26px;border-radius:50%;border:1.5px solid var(--muted);background:transparent;font-size:14px;cursor:pointer;padding:0;line-height:1;font-family:var(--f-body)}
.bub.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.bub[disabled]{cursor:default}
.mrow.ok .mk{border-color:var(--ok);color:var(--ok)} .mrow.ng .mk{border-color:var(--red);color:var(--red)}
.timer{position:sticky;top:52px;z-index:4;display:flex;align-items:center;gap:12px;background:var(--red-soft);border:1.5px solid var(--red);border-radius:12px;padding:8px 12px;margin-bottom:10px}
.timer .t{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--red)}
.timer .msg{font-size:13px;color:var(--muted);flex:1}
.start{text-align:center;padding:20px 12px}
.start p{color:var(--muted);margin:0 0 12px}
.result{border:2px solid var(--red);border-radius:14px;padding:14px;background:var(--surface);margin-top:12px}
.result .big{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums}
.result .big small{font-size:15px;color:var(--muted);font-weight:700}
.unit{border-top:1px solid var(--line);padding:8px 0;font-size:15px}
.unit .h{display:flex;gap:8px;align-items:center;font-weight:700}
.unit .ok{color:var(--ok)} .unit .ng{color:var(--red)}
.unit .ex{margin-top:4px;display:none} .unit.open .ex{display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--surface);cursor:pointer;font-size:14px}
.chip.on{border-color:var(--t5);background:var(--t5);color:#fff}
.rate{display:flex;gap:10px}.rate .chip{font-size:20px;min-width:60px;text-align:center}
textarea{width:100%;min-height:72px;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.send{background:var(--surface);border:2px solid var(--teal);border-radius:16px;padding:14px;margin-top:22px}
.send .sum{font-size:15px;margin:6px 0 10px;font-variant-numeric:tabular-nums}
.send a.go{display:inline-block;text-decoration:none}
.send small{display:block;color:var(--muted);margin-top:8px}
.pill{display:inline-block;background:var(--ok-soft);color:var(--ok);border-radius:999px;padding:1px 10px;font-size:13px}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
</style></head><body>
<div class="wrap" id="app"></div>

const LESSONS = [{"id": "L1", "no": 1, "title": "始点をそろえる・分解と係数比較", "goal": "1つの点を2通りの道で表し，係数を比べて比を出す。始点が変わっても書きかえられる。", "tools": [{"no": "①", "name": "終点 − 始点", "body": "どの点を始点にしても <span class=\"v\">PQ</span> = <span class=\"v\">OQ</span> − <span class=\"v\">OP</span>。<br>始点が O にそろえば，あとは「終点 − 始点」の引き算だけ。"}, {"no": "②", "name": "係数比較（分解は1通り）", "body": "<span class=\"v\">a</span> ≠ <span class=\"v\">0</span>，<span class=\"v\">b</span> ≠ <span class=\"v\">0</span> で，<span class=\"v\">a</span> と <span class=\"v\">b</span> が平行でないとき<br><span class=\"nw\"><span class=\"i\">s</span><span class=\"v\">a</span></span> + <span class=\"nw\"><span class=\"i\">t</span><span class=\"v\">b</span></span> = <span class=\"i\">s</span>′<span class=\"v\">a</span> + <span class=\"i\">t</span>′<span class=\"v\">b</span> ならば <span class=\"i\">s</span> = <span class=\"i\">s</span>′，<span class=\"i\">t</span> = <span class=\"i\">t</span>′"}, {"no": "③", "name": "向きが逆なら −1 倍", "body": "<span class=\"v\">BA</span> = −<span class=\"v\">AB</span>。始点を付け替えるときは「辞書」を先に作る（例：<span class=\"v\">a</span> = −<span class=\"v\">p</span>）。"}], "drill_head": "<span class=\"v\">OA</span> = <span class=\"v\">a</span>，<span class=\"v\">OB</span> = <span class=\"v\">b</span>，<span class=\"v\">OC</span> = <span class=\"v\">c</span> とする。(1)〜(4) を <span class=\"v\">a</span>，<span class=\"v\">b</span>，<span class=\"v\">c</span> で表せ。", "ex_setup": "平行四辺形 OACB において，<span class=\"v\">OA</span> = <span class=\"v\">a</span>，<span class=\"v\">OB</span> = <span class=\"v\">b</span> とする。辺 BC の中点を M とする。", "ex_signs": ["<b>「<span class=\"v\">a</span>，<span class=\"v\">b</span> を用いて」</b>＝始点は O。O から出発する道を作る。", "<b>始点が A に変わったら</b>，いきなり計算しない。まず<span class=\"v\">a</span>，<span class=\"v\">b</span> を <span class=\"v\">p</span>，<span class=\"v\">q</span> で書く<b>辞書</b>を作る。", "<b>向きに注意</b>。<span class=\"v\">AO</span> は <span class=\"v\">OA</span> の逆向き → −1 倍。"], "main_setup": "平行四辺形 ABCD において，<span class=\"v\">AB</span> = <span class=\" try{ const raw = localStorage.getItem(KEY); if(raw) S = Object.assign(S, JSON.parse(raw)); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function st(id){ return S.lessons[id] || (S.lessons[id] = {items:{}, mk:{cells:{}, started:0, scored:false}, refl:{miss:[], rate:"", next:"", unclear:""}, sentAt:"", active:0, last:0}); }
let cur = null, tick = null;
function touch(){ if(!cur) return; const s=st(cur.id), now=Date.now(); if(s.last) s.active=(s.active||0)+Math.min(now-s.last,120000); s.last=now; save(); }

const NUMS = "⓪①②③④⑤⑥⑦⑧⑨";
const el = (t,c,h)=>{ const e=document.createElement(t); if(c) e.className=c; if(h!=null) e.innerHTML=h; return e; };
const V = s => '<span class="v">'+s+'</span>';

/* ---------- 数の読み取り（全角・分数・小数OK） ---------- */
function norm(s){ return String(s).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[−ー－‐—]/g,"-").replace(/[／]/g,"/").replace(/[．]/g,".").replace(/\s/g,""); }
function num(s, blankZero){
  s = norm(s); if(s===""||s==="+") return blankZero?0:NaN; if(s==="-") return NaN;
  const m = s.match(/^([+-]?\d+(?:\.\d+)?)(?:\/([+-]?\d+(?:\.\d+)?))?$/); if(!m) return NaN;
  const a=parseFloat(m[1]), b=m[2]!=null?parseFloat(m[2]):1; return b===0?NaN:a/b;
}
const same=(x,y)=>Math.abs(x-y)<1e-9;

/* ---------- ホーム ---------- */
function home(){
  cur=null; window._rsum=null; if(tick){clearInterval(tick);tick=null;}
  const a=document.getElementById("app"); a.innerHTML="";
  a.appendChild(el("div","hero",`<div class="eb">共通テスト対策</div><h1>ベクトル 16点中13点へ</h1><p>1回50分。確認 → 例題 → 実戦12分 → 直し → ふりかえり。</p>`));
  const w=el("div","who");
  w.innerHTML=`<div class="row3"><div><label for="cls">組</label><input id="cls" autocomplete="off"></div><div><label for="num">番号</label><input id="num" inputmode="numeric" autocomplete="off"></div><div><label for="nm">名前</label><input id="nm" autocomplete="off"></div></div><div class="hint">先生への記録に使います。この端末にだけ保存されます。</div>`;
  a.appendChild(w);
  [["cls","cls"],["num","num"],["nm","name"]].forEach(([i,k])=>{ const inp=w.querySelector("#"+i); inp.value=S[k]||""; inp.addEventListener("input",()=>{S[k]=inp.value.trim(); save();}); });
  const ls=el("div","lessons");
  PLANNED.forEach(p=>{
    const L=LESSONS.find(x=>x.no===p.no);
    const b=el("button","lcard"); b.type="button";
    let stt="準備中";
    if(L){ const s=st(L.id); stt = s.mk.scored ? `実戦 ${s.mk.score}/${L.max}点`+(s.sentAt?"・送信済み":"") : "未実施"; b.addEventListener("click",()=>open(L.id)); }
    else b.disabled=true;
    b.innerHTML=`<div class="no"><span><small>第</small>${p.no}<small>回</small></span></div><div class="tt">${p.title}</div><div class="st">${stt}</div>`;
    ls.appendChild(b);
  });
  a.appendChild(ls);
  window.scrollTo(0,0);
}

/* ---------- 回を開く ---------- */
function open(id){
  cur=LESSONS.find(x=>x.id===id); const s=st(id); touch();
  const a=document.getElementById("app"); a.innerHTML="";
  const bar=el("div","bar"); const back=el("button","back","← もくじ"); back.type="button"; back.addEventListener("click",home);
  bar.append(back, el("div","ttl",`第${cur.no}回 ${cur.title}`), el("div","sc")); bar.lastChild.id="barsc"; a.appendChild(bar);
  a.appendChild(el("div","goal","今日のゴール："+cur.goal));
  a.appendChild(el("div","flow",[["確認",8,"--t1"],["例題",10,"--t2"],["実戦",12,"--t3"],["直し",15,"--t4"],["ふりかえり",5,"--t5"]].map(([n,w,c])=>`<div style="--w:${w};background:var(${c})">${n}${w}分</div>`).join("")));
  // 道具
  const s1=sec("確認","--t1","今日の道具"); cur.tools.forEach(t=>s1.appendChild(el("div","card tool",`<b>${t.no} ${t.name}</b><br>${t.body}`))); a.appendChild(s1);
  // ドリル
  const s2=sec("確認","--t1","ドリル"); s2.appendChild(el("p","lead",cur.drill_head)); cur.drill.forEach(it=>s2.appendChild(item(it))); a.appendChild(s2);
  // 例題
  const s3=sec("例題","--t2","誘導の読み方"); s3.appendChild(el("div","card prob",cur.ex_fig+cur.ex_setup));
  cur.ex_items.forEach(it=>s3.appendChild(item(it)));
  s3.appendChild(el("div","signs","<b>誘導のサイン</b><ol>"+cur.ex_signs.map(x=>"<li>"+x+"</li>").join("")+"</ol>")); a.appendChild(s3);
  // 実戦
  a.appendChild(mainSec());
  // ふりかえり・送信
  a.appendChild(reflSec());
  updBar(); window.scrollTo(0,0);
}
function sec(tag,col,h){ const d=el("section","sec"); d.appendChild(el("div","sh",`<span class="tag" style="background:var(${col})">${tag}</span><h2>${h}</h2>`)); return d; }
function updBar(){ if(window._rsum) try{window._rsum();}catch(e){} const b=document.getElementById("barsc"); if(!b||!cur) return; const x=stats(); b.textContent=`確認 ${x.done}/${x.total}`+(st(cur.id).mk.scored?`・実戦 ${st(cur.id).mk.score}点`:""); }

/* ---------- 確認・例題の1問 ---------- */
function item(it){
  const s=st(cur.id); const r=s.items[it.id]||(s.items[it.id]={tries:0,ok:false,shown:false,val:null});
  const c=el("div","card"); c.appendChild(el("div","q",it.q));
  const fb=el("div","fb"); let inputs=[];
  const showOk=()=>{ fb.className="fb ok"; fb.innerHTML=(r.shown?"答え：":"正解！")+(it.t==="choice"?"":" "+ansText(it))+`<div class="ex">${it.ex}</div>`; };
  const lock=()=>{ inputs.forEach(x=>x.disabled=true); c.querySelectorAll(".btn.judge").forEach(b=>b.disabled=true); };
  const btns=el("div","btns");
  const showBtn=el("button","btn ghost","答えを見る"); showBtn.type="button"; showBtn.style.display="none";
  showBtn.addEventListener("click",()=>{ r.shown=true; r.ok=true; save(); touch(); lock(); showOk(); showBtn.style.display="none"; updBar(); if(it.t==="choice") mark(it.ans); });
  const ng=(msg)=>{ r.tries++; save(); touch(); fb.className="fb ng"; fb.textContent=msg||"ちがうよ。もう一度。"; if(r.tries>=2) showBtn.style.display=""; };
  let mark=()=>{};
  if(it.t==="choice"){
    const bs=it.opts.map((o,i)=>{ const b=el("button","opt",o); b.type="button"; b.addEventListener("click",()=>{ if(r.ok) return; bs.forEach(z=>z.classList.remove("sel")); b.classList.add("sel"); r.val=i;
      if(i===it.ans){ r.tries++; r.ok=true; if(r.tries===1) r.first=true; save(); touch(); showOk(); showBtn.style.display="none"; updBar(); } else ng(); }); return b; });
    mark=i=>{ bs.forEach(z=>z.classList.remove("sel")); bs[i].classList.add("sel"); };
    bs.forEach(b=>c.appendChild(b)); inputs=bs;
    if(r.ok){ mark(it.ans); showOk(); }
  } else {
    const row=el("div","inrow");
    if(it.t==="coef"){
      it.basis.forEach((bname,i)=>{ if(i) row.appendChild(el("span","pl","+")); const inp=el("input"); inp.inputMode="text"; inp.autocomplete="off"; inp.setAttribute("aria-label",bname+" の係数"); row.appendChild(inp); row.appendChild(el("span",null,V(bname))); inputs.push(inp); });
    } else {
      it.labels.forEach((lb,i)=>{ if(i) row.appendChild(el("span","pl","，")); row.appendChild(el("span",null,'<span class="i">'+lb+'</span> =')); const inp=el("input"); inp.inputMode="text"; inp.autocomplete="off"; row.appendChild(inp); inputs.push(inp); });
    }
    c.appendChild(row);
    c.appendChild(el("div","hint", it.t==="coef" ? "係数を入れる。0 は空らんでよい。分数は 1/2，マイナスは -1/2。" : "分数は 1/2 のように入れる。"));
    if(r.val) inputs.forEach((x,i)=>x.value=r.val[i]||"");
    const jb=el("button","btn judge","判定"); jb.type="button";
    jb.addEventListener("click",()=>{
      const vals=inputs.map(x=>num(x.value, it.t==="coef")); r.val=inputs.map(x=>x.value); save();
      if(vals.some(isNaN)) { fb.className="fb ng"; fb.textContent="数が読めない らんがあるよ（例：-1/2）"; return; }
      const ok=vals.every((x,i)=>same(x,num(it.ans[i],true)));
      if(ok){ r.tries++; r.ok=true; if(r.tries===1) r.first=true; save(); touch(); lock(); showOk(); showBtn.style.display="none"; updBar(); }
      else ng(it.t==="coef" && vals.every((x,i)=>same(x,-num(it.ans[i],true))) ? "符号がぜんぶ逆。始点と終点を確かめよう。" : null);
    });
    btns.appendChild(jb);
    if(r.ok){ lock(); showOk(); }
  }
  btns.appendChild(showBtn); if(!r.ok && r.tries>=2) showBtn.style.display="";
  c.append(btns, fb); return c;
}
function frac(a){ const [n,d]=a.split("/"); return `<span class="fr"><span>${n}</span><span>${d}</span></span>`; }
function ansText(it){
  if(it.t==="pair") return it.labels.map((l,i)=>`<span class="i">${l}</span> = ${it.ans[i]}`).join("，");
  const parts=[]; it.basis.forEach((b,i)=>{ const a=it.ans[i]; if(a==="0") return; let c=a==="1"?"":a==="-1"?"−":a.includes("/")?(a.startsWith("-")?"−":"")+frac(a.replace("-","")):a.replace("-","−"); parts.push((parts.length&&!c.startsWith("−")?" + ":parts.length?" ":"")+c+V(b)); });
  return parts.join("").replace(/ −/g," − ");
}

/* ---------- 実戦（マーク・12分） ---------- */
function mainSec(){
  const s=st(cur.id), M=s.mk;
  const d=sec("実戦","--t3",`共通テスト形式（${cur.max}点・12分）`);
  const box=el("div"); d.appendChild(box);
  const render=()=>{
    box.innerHTML="";
    if(!M.started){
      const c=el("div","card start",`<p>タイマーが12分で区切ります。<br>時間がきても解き続けられますが「時間切れ」が記録されます。<br>採点できるのは1回。直しは何回でも。</p>`);
      const b=el("button","btn red","12分 スタート"); b.type="button"; b.addEventListener("click",()=>{ M.started=Date.now(); save(); touch(); render(); });
      c.appendChild(b); box.appendChild(c); return;
    }
    const tm=el("div","timer",`<div class="t" id="tmr">12:00</div><div class="msg" id="tmsg">12分で解く</div>`); box.appendChild(tm);
    const pc=el("div","card prob"); pc.innerHTML=cur.main_fig+cur.main_setup;
    cur.main_parts.forEach(([no,h])=>{
      const p=el("div","part",`<b>${no}</b>${h}`); pc.appendChild(p);
      cellsIn(h).forEach(cn=>{ if(cur.choices[cn]) pc.appendChild(el("div","gun",`<div class="h"><span class="mk">${cn}</span> の解答群</div>`+cur.choices[cn].map((o,i)=>`<div class="o">${NUMS[i]}　${o}</div>`).join(""))); });
      const ms=el("div","ms"); cellsIn(h).forEach(cn=>ms.appendChild(markRow(cn))); pc.appendChild(ms);
    });
    box.appendChild(pc);
    const act=el("div","btns");
    if(!M.scored){
      const b=el("button","btn red","採点する"); b.type="button";
      b.addEventListener("click",()=>{ const empty=Object.keys(cur.cells).filter(k=>M.cells[k]==null).length;
        if(empty && !confirm(`まだ ${empty} マス空いています。採点しますか？（採点は1回だけ）`)) return;
        const r=score(M.cells); M.scored=true; M.score=r.score; M.wrong=r.wrong; M.sec=Math.round((Date.now()-M.started)/1000); M.over=M.sec>720?1:0; M.first=Object.assign({},M.cells); save(); touch(); render(); updBar(); });
      act.appendChild(b);
    }
    box.appendChild(act);
    if(M.scored) box.appendChild(resultCard());
    startTick();
  };
  const markRow=(cn)=>{
    const row=el("div","mrow"); row.appendChild(el("span","mk",cn));
    const opts = cur.choice_cells.includes(cn) ? cur.choices[cn].map((_,i)=>[String(i),NUMS[i]]) : "0123456789".split("").map(x=>[x,x]);
    const locked = M.scored && !M.redo;
    opts.forEach(([v,lab])=>{ const b=el("button","bub"+(M.cells[cn]===v?" on":""),lab); b.type="button"; b.setAttribute("aria-label",cn+" "+lab); b.disabled=locked;
      b.addEventListener("click",()=>{ M.cells[cn] = M.cells[cn]===v ? null : v; save(); touch(); row.querySelectorAll(".bub").forEach(z=>z.classList.toggle("on", z===b && M.cells[cn]===v)); }); row.appendChild(b); });
    if(M.scored){ const ok=M.cells[cn]===cur.cells[cn]; if(!M.redo) row.classList.add(ok?"ok":"ng"); }
    return row;
  };
  const resultCard=()=>{
    const c=el("div","result");
    const pass = M.score>=13;
    c.innerHTML=`<div class="big">${M.score}<small> / ${cur.max}点</small></div><div>${pass?"8割ライン（13点）クリア！":"8割ライン（13点）まであと "+(13-M.score)+" 点"}　かかった時間 ${Math.floor(M.sec/60)}分${M.sec%60}秒${M.over?"（時間切れ）":""}</div>`+
      (M.redoScore!=null?`<div class="hint">直しの得点：${M.redoScore}点（記録は1回目の ${M.score}点）</div>`:"")+
      `<div class="hint">赤い問題をタップすると解説が出ます。</div>`;
    cur.units.forEach(u=>{ const ok=u.cells.every(k=>M.first[k]===cur.cells[k]);
      const ans=u.show||u.cells.map(k=>cur.choice_cells.includes(k)?NUMS[+cur.cells[k]]:cur.cells[k]).join("");
      const d=el("div","unit"+(ok?"":" open"),`<div class="h"><span class="${ok?"ok":"ng"}">${ok?"○":"×"}</span>${u.part} ${u.cells.map(k=>'<span class="mk">'+k+'</span>').join("")}<span style="margin-left:auto">${u.pt}点</span></div><div class="ex">正解 <b>${ans}</b>　${u.ex}</div>`);
      d.querySelector(".h").addEventListener("click",()=>d.classList.toggle("open")); c.appendChild(d); });
    c.appendChild(el("div","signs",cur.main_flow)); c.lastChild.style.marginTop="10px";
    c.appendChild(el("div","signs",cur.stumble)); c.lastChild.style.marginTop="8px";
    const b=el("button","btn ghost",M.redo?"直しを採点":"解き直す（直し）"); b.type="button";
    b.addEventListener("click",()=>{ if(!M.redo){ M.redo=true; M.cells={}; } else { const r=score(M.cells); M.redoScore=Math.max(M.redoScore||0,r.score); M.redo=false; } save(); touch(); render(); });
    const bb=el("div","btns"); bb.appendChild(b); c.appendChild(bb);
    return c;
  };
  render(); return d;
}
function cellsIn(h){ const out=[]; const re=/<span class="mk">([^<]+)<\/span>/g; let m; while((m=re.exec(h))){ if(cur.cells[m[1]]!=null && !out.includes(m[1])) out.push(m[1]); } return out; }
function score(cells){ let sc=0; const wrong=[]; cur.units.forEach(u=>{ if(u.cells.every(k=>cells[k]===cur.cells[k])) sc+=u.pt; else wrong.push(u.cells.join("")); }); return {score:sc, wrong}; }
function startTick(){
  if(tick) clearInterval(tick);
  const upd=()=>{ const t=document.getElementById("tmr"), m=document.getElementById("tmsg"); if(!t||!cur){ clearInterval(tick); tick=null; return; }
    const M=st(cur.id).mk; const el2=(M.scored?M.sec*1000:Date.now()-M.started), rest=720000-el2;
    const f=ms=>{ const s=Math.floor(Math.abs(ms)/1000); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };
    t.textContent = rest>=0 ? f(rest) : "+"+f(rest);
    m.textContent = M.scored ? "採点ずみ" : rest>=0 ? "のこり時間" : "時間切れ。区切りをつけて採点しよう";
  };
  upd(); tick=setInterval(upd,1000);
}

/* ---------- ふりかえり・送信 ---------- */
function reflSec(){
  const s=st(cur.id), R=s.refl;
  const d=sec("ふりかえり","--t5","直したあとに");
  const c1=el("div","card"); c1.appendChild(el("div","q","ミスの種類（いくつでも）"));
  const ch=el("div","chips"); cur.miss_types.concat(["ミスなし"]).forEach(m=>{ const b=el("button","chip"+(R.miss.includes(m)?" on":""),m); b.type="button";
    b.addEventListener("click",()=>{ const i=R.miss.indexOf(m); if(i<0) R.miss.push(m); else R.miss.splice(i,1); b.classList.toggle("on"); save(); touch(); }); ch.appendChild(b); });
  c1.appendChild(ch); d.appendChild(c1);
  const c2=el("div","card"); c2.appendChild(el("div","q","今日のゴールは達成できた？"));
  const rt=el("div","rate"); ["◎","○","△"].forEach(x=>{ const b=el("button","chip"+(R.rate===x?" on":""),x); b.type="button"; b.addEventListener("click",()=>{ R.rate=x; save(); touch(); rt.querySelectorAll(".chip").forEach(z=>z.classList.toggle("on",z.textContent===x)); }); rt.appendChild(b); });
  c2.appendChild(rt); d.appendChild(c2);
  const ta=(k,q)=>{ const c=el("div","card"); c.appendChild(el("div","q",q)); const t=el("textarea"); t.value=R[k]||""; t.addEventListener("input",()=>{ R[k]=t.value; save(); touch(); }); c.appendChild(t); return c; };
  d.append(ta("next","次に同じ型が出たら，最初に何をする？"), ta("unclear","まだわからないこと（なければ「なし」）"));
  const sd=el("div","send"); sd.appendChild(el("div","q","<b>先生に送る</b>")); const sum=el("div","sum"); sd.appendChild(sum);
  const rsum=()=>{ const x=stats(), M=s.mk; sum.innerHTML=`確認 <b>${x.done}</b>/${x.total}（1回目で正解 ${x.first}）　実戦 <b>${M.scored?M.score:"-"}</b>/${cur.max}点`+(s.sentAt?`<br><span class="pill">送信済み ${s.sentAt}</span>（何回でも送り直せる）`:""); };
  rsum(); window._rsum=rsum;
  if(SUBMIT_URL){
    const a=el("a","btn go","結果を先生に送る"); a.target="_blank"; a.rel="noopener"; const warn=el("small");
    const ready=()=>S.name&&S.num;
    const upd=()=>{ rsum(); if(ready()){ a.href=buildUrl(); a.style.opacity=""; warn.textContent="新しいタブで「送信しました」と出たら完了。授業の最後に必ず送ろう。"; } else { a.removeAttribute("href"); a.style.opacity=".4"; warn.textContent="もくじにもどって，組・番号・名前を入れてから送ろう。"; } };
    a.addEventListener("pointerdown",upd); a.addEventListener("focus",upd);
    a.addEventListener("click",()=>{ upd(); if(!ready()) return; const t=new Date(); s.sentAt=(t.getMonth()+1)+"/"+t.getDate()+" "+t.getHours()+":"+String(t.getMinutes()).padStart(2,"0"); save(); setTimeout(rsum,50); });
    upd(); sd.append(a,warn);
  } else sd.appendChild(el("small",null,"送信先がまだ設定されていません。先生の指示を待とう。"));
  d.appendChild(sd); return d;
}
function stats(){ const s=st(cur.id); const all=cur.drill.concat(cur.ex_items); let done=0,first=0,shown=0,tries=0;
  all.forEach(it=>{ const r=s.items[it.id]; if(!r) return; if(r.ok) done++; if(r.first) first++; if(r.shown) shown++; tries+=r.tries||0; });
  return {done, first, shown, tries, total:all.length, minutes:Math.round((s.active||0)/60000)}; }
function buildUrl(){
  const s=st(cur.id), x=stats(), M=s.mk, R=s.refl;
  const p={lesson:cur.no, cls:S.cls, num:S.num, name:S.name, done:x.done, total:x.total, first:x.first, shown:x.shown,
    score:M.scored?M.score:"", max:cur.max, sec:M.scored?M.sec:"", over:M.scored?M.over:"", wrong:(M.wrong||[]).join(" "), redo:M.redoScore!=null?M.redoScore:"",
    miss:R.miss.join("・"), rate:R.rate, next:R.next||"", unclear:R.unclear||"", minutes:x.minutes, ver:APP_VER};
  return SUBMIT_URL+"?"+Object.entries(p).map(([k,v])=>k+"="+encodeURIComponent(String(v).slice(0,500))).join("&");
}
home();
</script>
</body></html>
