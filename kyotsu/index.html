<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>共テ数学 8割へ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Noto+Serif+JP:wght@400;600&family=STIX+Two+Text:ital,wght@0,400;1,400&display=swap">
<style>
:root{
  --bg:#f4f6f7; --surface:#ffffff; --ink:#172126; --muted:#5d6f76; --line:#d5dee1;
  --teal:#0f6e78; --teal-soft:#e2f1f2; --orange:#c0571b; --orange-soft:#fbeee6;
  --red:#b8322a; --red-soft:#fbe9e7; --ok:#1f7a45; --ok-soft:#e3f3e9;
  --ia:#0f6e78; --ii:#3a67ad; --bc:#6a4c9c; --t1:#0f6e78; --t2:#b8322a; --t3:#6a4c9c;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-prob:"Noto Serif JP","Hiragino Mincho ProN",serif;
  --f-math:"Latin Modern Roman","STIX Two Text","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1619; --surface:#172226; --ink:#e3edf0; --muted:#93a8ae; --line:#2a3a3f;
  --teal:#4fb7c2; --teal-soft:#16353a; --orange:#f08a4b; --orange-soft:#3a2418;
  --red:#f07a6e; --red-soft:#3a1d1a; --ok:#5fcf8a; --ok-soft:#173326;
  --ia:#2f9aa5; --ii:#5584cc; --bc:#8466b8; --t1:#2f9aa5; --t2:#d0554a; --t3:#8466b8; color-scheme:dark}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;margin:0;-webkit-text-size-adjust:100%}
.wrap{max-width:600px;margin:0 auto;padding:0 16px 110px}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;color:inherit}
a{color:var(--teal)}

/* 数式 */
.i{font-family:var(--f-math);font-style:italic;font-size:1.06em;margin:0 .03em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.92em;line-height:1.15;margin:0 .12em}
.fr>span:first-child{border-bottom:.07em solid currentColor;padding:0 .18em .06em}
.fr>span:last-child{padding-top:.06em}
.rt{position:relative;display:inline-block;white-space:nowrap;padding-left:.6em;margin:0 .04em;line-height:1.25}
.rt .rs{position:absolute;left:0;top:0;width:.62em;height:100%;overflow:visible;fill:none;stroke:currentColor;stroke-width:1.25;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.rt .rd{display:inline-block;border-top:.075em solid currentColor;padding:.1em .1em 0 .05em;line-height:1.2}
.ov{display:inline-block;border-top:.07em solid currentColor;line-height:1.1;padding:0 .04em}
sup{font-size:.7em;line-height:0}
.mk{display:inline-block;border:1.3px solid currentColor;min-width:1.35em;text-align:center;font-family:var(--f-body);font-weight:700;font-style:normal;font-size:.9em;line-height:1.35;padding:0 .18em;margin:0 .08em;vertical-align:.05em}
.nw{white-space:nowrap}
.fr .mk{margin:.06em .05em}
svg.fig{color:var(--ink);max-width:100%;height:auto;display:block;margin:6px auto}
svg.fig .ln{stroke:currentColor;fill:none} svg.fig .sub{stroke:var(--muted);fill:none} svg.fig .dot{fill:currentColor}
svg.fig .lab{fill:currentColor;font-family:var(--f-math);font-style:italic} svg.fig .note{fill:var(--muted);font-family:var(--f-body)}
svg.fig .a1{stroke:var(--teal)} svg.fig .a2{stroke:var(--orange)} svg.fig .a1t{fill:var(--teal)}
.v{font-size:1.06em;display:inline-block;position:relative;font-family:var(--f-math);font-style:italic;line-height:1;padding-top:.42em;padding-right:.08em;margin:0 .03em}
.v::before{content:"";position:absolute;left:.06em;right:.12em;top:.17em;border-top:.065em solid currentColor}
.v::after{content:"";position:absolute;right:-.03em;top:.08em;border-left:.26em solid currentColor;border-top:.12em solid transparent;border-bottom:.12em solid transparent}
.op{font-size:1.25em;font-family:var(--f-math);display:inline-flex;align-items:center;margin-right:.1em}
.op .lm{display:inline-flex;flex-direction:column;justify-content:space-between;font-size:.55em;line-height:1.05;margin-left:.05em;align-self:stretch}
.sg{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 .1em}
.sg>span:first-child,.sg>span:last-child{font-size:.7em}
.sg .sgs{font-size:1.3em;font-family:var(--f-math)}
sub{font-size:.7em;line-height:0}
.bo{margin:0 .14em}
sup .bo,sub .bo,.lm .bo,.sg .bo{margin:0 .05em}

/* 上の帯 */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:12px}
.bar .back{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;white-space:nowrap}
.bar .ttl{font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sc{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);white-space:nowrap}

/* ホーム */
.hero{padding:22px 0 6px}
.hero .eb{font-size:13px;letter-spacing:.14em;color:var(--red);font-weight:700}
.hero h1{font-size:30px;font-weight:900;line-height:1.25;margin-top:4px}
.hero p{color:var(--muted);margin:8px 0 0}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0}
.box h3{font-size:15px;margin-bottom:6px}
.box label{font-size:13px;color:var(--muted);display:block;margin-bottom:2px}
.box input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.row3{display:grid;grid-template-columns:4.4em 5em 1fr;gap:10px}
.next{display:block;width:100%;text-align:left;border:2px solid var(--red);background:var(--red-soft);border-radius:16px;padding:14px;cursor:pointer;margin:14px 0}
.next .k{font-size:12px;color:var(--red);font-weight:700;letter-spacing:.1em}
.next .t{font-size:18px;font-weight:900}
.week{margin-top:22px}
.week>h2{font-size:16px;color:var(--muted);margin-bottom:8px}
.days{display:grid;gap:10px}
.dcard{display:grid;grid-template-columns:auto 1fr;gap:0 12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;width:100%}
.dcard[disabled]{opacity:.45;cursor:default}
.dcard .no{grid-row:span 2;width:50px;height:50px;border-radius:12px;color:#fff;display:grid;place-items:center;font-weight:900;font-size:19px;line-height:1;text-align:center}
.dcard .no small{display:block;font-size:10px;font-weight:700}
.dcard .tt{font-weight:700;line-height:1.4}
.dcard .st{font-size:13px;color:var(--muted)}
.dcard.done{border-color:var(--ok)}
.atag{display:inline-block;font-size:11px;font-weight:700;color:#fff;border-radius:4px;padding:0 6px;margin-right:6px;vertical-align:2px}
.tcard{display:block;width:100%;text-align:left;border:2px dashed var(--red);background:var(--surface);border-radius:14px;padding:12px 14px;cursor:pointer;margin-top:10px}
.tcard .tt{font-weight:900}
.tcard .st{font-size:13px;color:var(--muted)}
.meter{font-size:14px}
.meter .r{display:flex;align-items:center;gap:8px;margin:3px 0}
.meter .r span:first-child{width:5.5em;color:var(--muted);font-size:13px}
.meter .bg{flex:1;height:10px;background:var(--bg);border-radius:6px;overflow:hidden}
.meter .fg{height:100%;background:var(--orange)}

/* 1日の画面 */
.goal{background:var(--teal-soft);border-left:5px solid var(--teal);border-radius:8px;padding:10px 12px;margin:4px 0 6px;font-weight:700}
.flow{display:flex;gap:3px;font-size:12px;margin-bottom:8px}.flow div{color:#fff;padding:2px 6px;border-radius:4px;flex:1;white-space:nowrap;overflow:hidden;text-align:center}
.sec{margin-top:28px}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tag{color:#fff;font-weight:700;font-size:13px;padding:2px 12px;border-radius:999px;white-space:nowrap}
.sh h2{font-size:19px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.tool b{color:var(--teal)}
.rv{border:2px solid var(--orange)}
.rv .rvh{font-size:12px;font-weight:700;color:var(--orange);margin-bottom:4px}
.q{margin-bottom:8px}
.inrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:18px}
.inrow input{width:4.2em;font:inherit;font-size:17px;text-align:center;padding:6px 4px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{border:1.5px solid var(--teal);background:var(--teal);color:#fff;border-radius:999px;padding:7px 18px;cursor:pointer;font-weight:700;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--teal)}
.btn.red{border-color:var(--red);background:var(--red)}
.btn.sm{padding:4px 12px;font-size:14px}
.btn[disabled]{opacity:.4;cursor:default}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;margin-top:6px;cursor:pointer}
.opt.sel{border-color:var(--teal);background:var(--teal-soft)}
.fb{margin-top:8px;font-size:15px;border-radius:8px;padding:6px 10px;display:none}
.fb.ok{display:block;background:var(--ok-soft);color:var(--ok)}
.fb.ng{display:block;background:var(--orange-soft);color:var(--orange)}
.fb .ex{color:var(--ink);margin-top:4px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.signs{background:var(--orange-soft);border-radius:12px;padding:10px 14px;margin-top:10px}

.prob{font-family:var(--f-prob);line-height:2}
.prob .eq{text-align:center}
.talk p{margin:4px 0;display:flex}.talk p b{flex:0 0 3em;font-family:var(--f-body)}.talk p span.say{flex:1}
.part{margin-top:12px}
.part>b{font-family:var(--f-body);margin-right:4px}
.gun{border:1px solid var(--ink);padding:6px 10px;margin:8px 0;font-size:15px;font-family:var(--f-prob)}
.gun .h{font-family:var(--f-body);font-size:12px}
.gun div.o{padding:2px 0}
.ms{margin:8px 0 4px;display:grid;gap:6px}
.mrow{display:flex;align-items:center;gap:2px;flex-wrap:nowrap}
.mrow .mk{font-size:14px;min-width:1.7em;margin-right:3px;flex:0 0 auto}
.bub{width:23px;height:23px;flex:0 0 23px;border-radius:50%;border:1.5px solid var(--muted);background:transparent;font-size:14px;cursor:pointer;padding:0;line-height:1;font-family:var(--f-body)}
.bub.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.bub[disabled]{cursor:default}
.mrow.ok .mk{border-color:var(--ok);color:var(--ok)} .mrow.ng .mk{border-color:var(--red);color:var(--red)}
.timer{position:sticky;top:52px;z-index:4;display:flex;align-items:center;gap:12px;background:var(--red-soft);border:1.5px solid var(--red);border-radius:12px;padding:8px 12px;margin-bottom:10px}
.timer .t{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--red)}
.timer .msg{font-size:13px;color:var(--muted);flex:1}
.start{text-align:center;padding:20px 12px}
.start p{color:var(--muted);margin:0 0 12px}
.result{border:2px solid var(--red);border-radius:14px;padding:14px;background:var(--surface);margin-top:12px}
.result .big{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums}
.result .big small{font-size:15px;color:var(--muted);font-weight:700}
.olist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.olist span{border-radius:6px;padding:0 6px;font-size:14px}
.olist .ok{background:var(--ok-soft);color:var(--ok)} .olist .ng{background:var(--red-soft);color:var(--red)}

.unit{border-top:1px solid var(--line);padding:10px 0;font-size:15px}
.unit .h{display:flex;gap:8px;align-items:center;font-weight:700}
.unit .ok{color:var(--ok)} .unit .ng{color:var(--red)}
.ladder>div{margin-top:6px;border-radius:8px;padding:6px 10px}
.ladder .h1,.ladder .h2{background:var(--teal-soft)}
.ladder .exb{background:var(--bg);border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--surface);cursor:pointer;font-size:14px}
.chip.on{border-color:var(--t3);background:var(--t3);color:#fff}
textarea{width:100%;min-height:72px;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.send{background:var(--surface);border:2px solid var(--teal);border-radius:16px;padding:14px;margin-top:22px}
.send .sum{font-size:15px;margin:6px 0 10px;font-variant-numeric:tabular-nums}
.send small{display:block;color:var(--muted);margin-top:8px}
.pill{display:inline-block;background:var(--ok-soft);color:var(--ok);border-radius:999px;padding:1px 10px;font-size:13px}

/* 通し演習 */
table.sc{width:100%;border-collapse:collapse;font-size:15px}
table.sc th,table.sc td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
table.sc td input{width:4em;font:inherit;text-align:center;padding:4px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
table.sc td.n{font-variant-numeric:tabular-nums;color:var(--muted)}
.tot{font-size:20px;font-weight:900;margin-top:8px;font-variant-numeric:tabular-nums}
.tpl table{width:100%;border-collapse:collapse;font-size:14px}
.tpl td,.tpl th{border:1px solid var(--line);padding:4px 6px;vertical-align:top}

/* 質問ボタン */
.fab{position:fixed;right:16px;bottom:18px;z-index:20;border:none;background:var(--orange);color:#fff;border-radius:999px;padding:10px 18px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.modal .in{background:var(--surface);width:100%;max-width:600px;border-radius:18px 18px 0 0;padding:16px 16px 26px}
.modal select{width:100%;font:inherit;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin:6px 0 10px}
/* 基本事項 */
details.kiso>summary{cursor:pointer;font-weight:700;list-style:none}
details.kiso>summary::-webkit-details-marker{display:none}
details.kiso>summary::before{content:"▶ ";font-size:12px;color:var(--muted)}
details.kiso[open]>summary::before{content:"▼ "}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.kb{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 8px;font-size:14px;line-height:1.35;cursor:pointer}
.kb small{display:block;font-size:11px;color:var(--muted)}
.kh{font-size:12px;font-weight:700;color:var(--muted);margin-top:10px}
.klink{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid var(--teal);background:var(--teal-soft);border-radius:12px;padding:10px 12px;cursor:pointer;margin-bottom:12px}
.klink b{color:var(--teal)}
.kimg{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:10px;margin:0 0 12px;background:#fff}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
</style></head><body>
<div class="wrap" id="app"></div>
<script>

const {MASTER, FIELDS, TESTS, UNITS, TEMPLATE, KISO} = DATA;
function kisoOf(id){ return (KISO||[]).find(k=>k.units.includes(id)); }
const AREA = {IA:["ⅠA","--ia"], II:["ⅡBC","--ii"], BC:["ⅡBC選択","--bc"]};
const MISS = ["知識（公式・定義）","計算","読み取り（条件・誘導）","時間"];
const NUMS = "⓪①②③④⑤⑥⑦⑧⑨";

/* ---------- 保存（この端末だけ） ---------- */
const KEY = "ktkm.v1";
let S = {cls:"", num:"", name:"", sel:[], units:{}, tests:{}};
try{ const raw = localStorage.getItem(KEY); if(raw) S = Object.assign(S, JSON.parse(raw)); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function st(id){ return S.units[id] || (S.units[id] = {items:{}, mk:{cells:{}, started:0, scored:false}, fix:{lv:{}, miss:{}}, refl:{next:"", unclear:""}, sentAt:"", active:0, last:0}); }
function tst(no){ return S.tests[no] || (S.tests[no] = {ia:{p:{}, t:{}, start:0}, ii:{p:{}, t:{}, start:0}, note:"", note2:"", sentAt:""}); }
let cur = null, curDay = 0, tick = null, page = "home";
function touch(){ if(!cur) return; const s=st(cur.id), now=Date.now(); if(s.last) s.active=(s.active||0)+Math.min(now-s.last,120000); s.last=now; save(); }

const el = (t,c,h)=>{ const e=document.createElement(t); if(c) e.className=c; if(h!=null) e.innerHTML=h; return e; };
function btn(label, cls, fn){ const b=el("button", "btn"+(cls?" "+cls:""), label); b.type="button"; if(fn) b.addEventListener("click", fn); return b; }
function norm(s){ return String(s).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[−ー－‐—]/g,"-").replace(/[／]/g,"/").replace(/[．]/g,".").replace(/\s/g,""); }
function num(s){ s = norm(s); if(s===""||s==="-"||s==="+") return NaN;
  const m = s.match(/^([+-]?\d+(?:\.\d+)?)(?:\/([+-]?\d+(?:\.\d+)?))?$/); if(!m) return NaN;
  const a=parseFloat(m[1]), b=m[2]!=null?parseFloat(m[2]):1; return b===0?NaN:a/b; }
const same=(x,y)=>Math.abs(x-y)<1e-9;
function stopTick(){ if(tick){ clearInterval(tick); tick=null; } }
function fmt(ms){ const s=Math.floor(Math.abs(ms)/1000); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function nowStr(){ const t=new Date(); return (t.getMonth()+1)+"/"+t.getDate()+" "+t.getHours()+":"+String(t.getMinutes()).padStart(2,"0"); }

/* ---------- 自分の予定（選んだ3分野で25日） ---------- */
function plan(){ return MASTER.filter(u=>u.area!=="BC" || S.sel.includes(u.fld)); }
function weeks(){ const P=plan(), W=[]; for(let w=0; w<TESTS.length; w++) W.push({days:P.slice(w*5, w*5+5).map((u,i)=>({u, day:w*5+i+1})), test:TESTS[w]}); return W; }
function unitDone(id){ return st(id).mk.scored; }
function testDone(no){ const t=S.tests[no]; return !!(t && (t.sentAt || Object.keys(t.ia.p).length || Object.keys(t.ii.p).length)); }

/* ---------- ホーム ---------- */
function home(){
  cur=null; page="home"; stopTick();
  const a=document.getElementById("app"); a.innerHTML="";
  a.appendChild(el("div","hero",`<div class="eb">倉敷高校 特進｜共通テスト数学</div><h1>ⅠA・ⅡBC 8割へ</h1><p>平日は1日30分（10分×3回でもよい）。5日ごとに本番形式の通し演習。全部で25日＋通し演習5回。</p>`));
  const w=el("div","box");
  w.innerHTML=`<div class="row3"><div><label for="cls">組</label><input id="cls" autocomplete="off"></div><div><label for="num">番号</label><input id="num" inputmode="numeric" autocomplete="off"></div><div><label for="nm">名前</label><input id="nm" autocomplete="off"></div></div><div class="hint">先生への記録に使います。この端末にだけ保存されます。</div>`;
  a.appendChild(w);
  [["cls","cls"],["num","num"],["nm","name"]].forEach(([i,k])=>{ const inp=w.querySelector("#"+i); inp.value=S[k]||""; inp.addEventListener("input",()=>{S[k]=inp.value.trim(); save();}); });

  // 選択問題
  const sb=el("div","box"); sb.appendChild(el("h3",null,"ⅡBC の選択問題（第4〜7問から3つ）"));
  const ch=el("div","chips"); const msg=el("div","hint");
  const showMsg=()=>{ msg.textContent = S.sel.length===3 ? "この3つで予定を作りました。あとで変えると Day の番号がずれます。" : `あと ${3-S.sel.length} つ選ぶと、あなたの25日の予定ができます。`; };
  Object.entries(FIELDS).forEach(([k,v])=>{ const b=el("button","chip"+(S.sel.includes(k)?" on":""),v); b.type="button";
    b.addEventListener("click",()=>{ const i=S.sel.indexOf(k); if(i>=0) S.sel.splice(i,1); else { if(S.sel.length>=3){ msg.textContent="選べるのは3つまで。先にどれかを外してください。"; return; } S.sel.push(k); } save(); home(); });
    ch.appendChild(b); });
  showMsg(); sb.append(ch,msg); a.appendChild(sb);

  // 次にやること
  const W=weeks(); let nx=null;
  outer: for(const wk of W){ for(const d of wk.days){ if(UNITS[d.u.id] && !unitDone(d.u.id)){ nx={kind:"day",d}; break outer; } if(!UNITS[d.u.id]){ nx={kind:"wait",d}; break outer; } } if(wk.days.length===5 && !testDone(wk.test.no)){ nx={kind:"test",t:wk.test}; break; } }
  if(S.sel.length===3 && nx){
    const b=el("button","next"); b.type="button";
    if(nx.kind==="day"){ b.innerHTML=`<div class="k">次にやること</div><div class="t">Day ${nx.d.day}　${nx.d.u.title}</div>`; b.addEventListener("click",()=>openDay(nx.d.u.id)); }
    else if(nx.kind==="test"){ b.innerHTML=`<div class="k">次にやること</div><div class="t">通し演習${NUMS[nx.t.no]}　${nx.t.title}</div>`; b.addEventListener("click",()=>openTest(nx.t.no)); }
    else { b.innerHTML=`<div class="k">次にやること</div><div class="t">Day ${nx.d.day} は準備中</div><div class="hint">先生が出すまで、これまでの直しをしておこう。</div>`; b.disabled=true; }
    a.appendChild(b);
  }

  // 基本事項
  if(KISO && KISO.length){
    const kb=el("details","box kiso"); kb.appendChild(el("summary",null,`基本事項（${KISO.length}分野・PDF）`));
    kb.appendChild(el("div","hint","公式と、共テでの使いどころ・よくあるミスを分野ごとにまとめたもの。スマホの縦画面でそのまま読める大きさです。"));
    let last="";
    KISO.forEach(K=>{ if(K.area!==last){ kb.appendChild(el("div","kh",K.area)); kb.appendChild(el("div","kgrid")); last=K.area; }
      const b=el("button","kb",`${K.title}<small>${K.imgs.length}ページ</small>`); b.type="button"; b.addEventListener("click",()=>openKiso(K.no)); kb.lastChild.appendChild(b); });
    a.appendChild(kb);
  }
  // ミスの内訳
  const cnt={}; let n=0; Object.values(S.units).forEach(u=>Object.values((u.fix||{}).miss||{}).forEach(m=>{ cnt[m]=(cnt[m]||0)+1; n++; }));
  if(n){ const mb=el("div","box meter"); mb.appendChild(el("h3",null,"あなたのミスの内訳"));
    const mx=Math.max(...Object.values(cnt)); MISS.forEach(m=>{ const c=cnt[m]||0; mb.appendChild(el("div","r",`<span>${m.replace(/（.*）/,"")}</span><div class="bg"><div class="fg" style="width:${c/mx*100}%"></div></div><b>${c}</b>`)); });
    mb.appendChild(el("div","hint","いちばん多いミスが、次に気をつけるところ。")); a.appendChild(mb); }

  // 週ごとの一覧
  W.forEach((wk,wi)=>{
    const sec=el("section","week"); sec.appendChild(el("h2",null,`第${wi+1}週`));
    const ds=el("div","days");
    wk.days.forEach(({u,day})=>{
      const U=UNITS[u.id], s=S.units[u.id]; const [an,ac]=AREA[u.area];
      const b=el("button","dcard"); b.type="button";
      let stt="準備中";
      if(U){ stt = s&&s.mk.scored ? `実戦 ${s.mk.score}/${U.main.max}点`+(s.sentAt?"・送信済み":"") : "未実施"; if(s&&s.mk.scored) b.classList.add("done"); b.addEventListener("click",()=>openDay(u.id)); }
      else b.disabled=true;
      b.innerHTML=`<div class="no" style="background:var(${ac})"><span><small>Day</small>${day}</span></div><div class="tt"><span class="atag" style="background:var(${ac})">${an}</span>${u.title}</div><div class="st">${u.sub}｜${stt}</div>`;
      ds.appendChild(b);
    });
    sec.appendChild(ds);
    const t=wk.test, ts=S.tests[t.no];
    const tb=el("button","tcard"); tb.type="button";
    tb.innerHTML=`<div class="tt">通し演習${NUMS[t.no]}　${t.title}</div><div class="st">ⅠA 70分 → ⅡBC 70分（本番と同じ順）`+(ts&&ts.sentAt?"・送信済み":testDone(t.no)?"・記入あり":"")+`</div>`;
    tb.addEventListener("click",()=>openTest(t.no)); sec.appendChild(tb);
    a.appendChild(sec);
  });
  if(S.sel.length!==3) a.appendChild(el("div","hint","※ 選択問題を3つ選ぶまでは、選択分野の日が並びません。"));
  fab(); window.scrollTo(0,0);
}

/* ---------- 1日分 ---------- */
function sec(tag,col,h){ const d=el("section","sec"); d.appendChild(el("div","sh",`<span class="tag" style="background:var(${col})">${tag}</span><h2>${h}</h2>`)); return d; }
function openDay(id){
  stopTick(); page="day";
  cur=Object.assign({id}, UNITS[id]); const meta=MASTER.find(u=>u.id===id); const P=plan(); curDay=P.findIndex(u=>u.id===id)+1; touch();
  const a=document.getElementById("app"); a.innerHTML="";
  const bar=el("div","bar"); bar.append(btn("← もくじ","back",home), el("div","ttl",`Day ${curDay}　${meta.title}`), el("div","sc")); bar.firstChild.className="back"; bar.lastChild.id="barsc"; a.appendChild(bar);
  a.appendChild(el("div","goal","今日のゴール："+cur.goal));
  a.appendChild(el("div","flow",[["① 道具 10分","--t1"],["② 実戦 "+cur.main.minutes+"分","--t2"],["③ 直し 10分","--t3"]].map(([n,c])=>`<div style="background:var(${c})">${n}</div>`).join("")));

  // ① 道具
  const s1=sec("①","--t1","道具");
  const prev=P[curDay-2];
  if(prev && UNITS[prev.id] && S.units[prev.id] && S.units[prev.id].mk.scored){
    const wrong=S.units[prev.id].mk.wrong||[]; const rvs=(UNITS[prev.id].revenge||[]).filter(r=>r.from.some(k=>wrong.includes(k)));
    if(rvs.length){ s1.appendChild(el("div","hint",`前の日（${prev.title}）にまちがえた型を、数を替えてもう一度。`));
      rvs.forEach(r=>{ const c=item(r.item, "rv:"+prev.id+":"+r.rid); c.classList.add("rv"); c.insertBefore(el("div","rvh","リベンジ"), c.firstChild); s1.appendChild(c); }); }
  }
  const K=kisoOf(id);
  if(K){ const kl=el("button","klink",`<span>📄</span><span><b>基本事項：${K.title}</b><br><span class="hint">${K.imgs.length}ページ。道具カードの前に、さっと目を通す</span></span>`); kl.type="button"; kl.addEventListener("click",()=>openKiso(K.no, ()=>openDay(id))); s1.appendChild(kl); }
  cur.tools.forEach(t=>s1.appendChild(el("div","card tool",`<b>${t.no} ${t.name}</b><br>${t.body}`)));
  s1.appendChild(el("div","hint","まず道具カードを読んでから、下の8問。2回まちがえると「答えを見る」が出ます。"));
  cur.drill.forEach(it=>s1.appendChild(item(it, it.id)));
  a.appendChild(s1);
  // ② 実戦
  a.appendChild(mainSec());
  // ③ 直し
  const s3=sec("③","--t3","直し"); const fixBox=el("div"); s3.appendChild(fixBox); window._fix=()=>renderFix(fixBox); renderFix(fixBox);
  s3.appendChild(reflBox()); a.appendChild(s3);
  updBar(); fab(); window.scrollTo(0,0);
}
function updBar(){ if(window._rsum) try{window._rsum();}catch(e){} const b=document.getElementById("barsc"); if(!b||!cur) return; const x=stats(); b.textContent=`① ${x.done}/${x.total}`+(st(cur.id).mk.scored?`・② ${st(cur.id).mk.score}点`:""); }

/* ---------- 即答の1問 ---------- */
function item(it, key){
  const s=st(cur.id); const r=s.items[key]||(s.items[key]={tries:0,ok:false,shown:false,val:null});
  const c=el("div","card"); c.appendChild(el("div","q",it.q));
  const fb=el("div","fb"); let inputs=[];
  const ansHtml = it.t==="choice" ? NUMS[it.ans]+"　"+it.opts[it.ans] : it.t==="pair" ? it.labels.map((l,i)=>`${l} = ${it.ans[i]}`).join("，") : it.ans;
  const showOk=()=>{ fb.className="fb ok"; fb.innerHTML=(r.shown?"答え：":"正解！ ")+ansHtml+`<div class="ex">${it.ex}</div>`; };
  const lock=()=>{ inputs.forEach(x=>x.disabled=true); c.querySelectorAll(".btn.judge").forEach(b=>b.disabled=true); };
  const btns=el("div","btns");
  const showBtn=btn("答えを見る","ghost sm"); showBtn.style.display="none";
  const good=()=>{ r.tries++; r.ok=true; if(r.tries===1) r.first=true; save(); touch(); lock(); showOk(); showBtn.style.display="none"; updBar(); };
  const ng=(msg)=>{ r.tries++; save(); touch(); fb.className="fb ng"; fb.textContent=msg||"ちがうよ。もう一度。"; if(r.tries>=2) showBtn.style.display=""; };
  let mark=()=>{};
  showBtn.addEventListener("click",()=>{ r.shown=true; r.ok=true; save(); touch(); lock(); showOk(); showBtn.style.display="none"; updBar(); if(it.t==="choice") mark(it.ans); });
  if(it.t==="choice"){
    const bs=it.opts.map((o,i)=>{ const b=el("button","opt",NUMS[i]+"　"+o); b.type="button"; b.addEventListener("click",()=>{ if(r.ok) return; bs.forEach(z=>z.classList.remove("sel")); b.classList.add("sel"); r.val=i; if(i===it.ans) good(); else ng(); }); return b; });
    mark=i=>{ bs.forEach(z=>z.classList.remove("sel")); bs[i].classList.add("sel"); };
    bs.forEach(b=>c.appendChild(b)); inputs=bs;
    if(r.ok){ mark(it.ans); lock(); showOk(); }
  } else {
    const row=el("div","inrow");
    const labels = it.t==="pair" ? it.labels : [it.label||"答え"];
    labels.forEach((lb,i)=>{ if(i) row.appendChild(el("span",null,"，")); row.appendChild(el("span",null,lb+" =")); const inp=el("input"); inp.inputMode="text"; inp.autocomplete="off"; inp.setAttribute("aria-label",lb); row.appendChild(inp); inputs.push(inp); });
    c.appendChild(row); c.appendChild(el("div","hint","数を入れる。分数は 1/2，マイナスは -3 のように。"));
    if(r.val) inputs.forEach((x,i)=>x.value=r.val[i]||"");
    const jb=btn("判定","judge sm");
    jb.addEventListener("click",()=>{ const vals=inputs.map(x=>num(x.value)); r.val=inputs.map(x=>x.value); save();
      if(vals.some(isNaN)){ fb.className="fb ng"; fb.textContent="数が読めない らんがあるよ（例：-1/2）"; return; }
      const ans = it.t==="pair" ? it.ans : [it.ans];
      if(vals.every((x,i)=>same(x,num(ans[i])))) good(); else ng(); });
    btns.appendChild(jb);
    if(r.ok){ lock(); showOk(); }
  }
  btns.appendChild(showBtn); if(!r.ok && r.tries>=2) showBtn.style.display="";
  c.append(btns, fb); return c;
}

/* ---------- ② 実戦（マーク・タイマー） ---------- */
function cellsIn(h){ const out=[]; const re=/<span class="mk">([^<]+)<\/span>/g; let m; while((m=re.exec(h))){ if(cur.main.cells[m[1]]!=null && !out.includes(m[1])) out.push(m[1]); } return out; }
function ukey(u){ return u.cells.join(""); }
function score(cells){ let sc=0; const wrong=[]; cur.main.units.forEach(u=>{ if(u.cells.every(k=>cells[k]===cur.main.cells[k])) sc+=u.pt; else wrong.push(ukey(u)); }); return {score:sc, wrong}; }
function cellShow(k){ const v=cur.main.cells[k]; return cur.main.choice_cells.includes(k) ? NUMS[+v] : v==="-" ? "−" : v; }
function mainSec(){
  const s=st(cur.id), M=s.mk, T=cur.main, LIM=T.minutes*60000;
  const d=sec("②","--t2",`実戦（共テ形式・${T.max}点・${T.minutes}分）`);
  const box=el("div"); d.appendChild(box);
  const render=()=>{
    box.innerHTML="";
    if(!M.started){
      const c=el("div","card start",`<p>${T.minutes}分のタイマーで解きます。<br>時間がきても続けられますが「時間切れ」が記録されます。<br>採点は1回だけ。直しは何回でも。<br>計算用紙を用意してから始めよう。</p>`);
      c.appendChild(btn(T.minutes+"分 スタート","red",()=>{ M.started=Date.now(); save(); touch(); render(); }));
      box.appendChild(c); return;
    }
    box.appendChild(el("div","timer",`<div class="t" id="tmr">${fmt(LIM)}</div><div class="msg" id="tmsg"></div>`));
    const pc=el("div","card prob"); pc.innerHTML=(T.fig||"")+T.setup;
    T.parts.forEach(([no,h])=>{
      pc.appendChild(el("div","part",`<b>${no}</b>${h}`));
      cellsIn(h).forEach(cn=>{ if(T.choices[cn]) pc.appendChild(el("div","gun",`<div class="h"><span class="mk">${cn}</span> の解答群</div>`+T.choices[cn].map((o,i)=>`<div class="o">${NUMS[i]}　${o}</div>`).join(""))); });
      const ms=el("div","ms"); cellsIn(h).forEach(cn=>ms.appendChild(markRow(cn))); pc.appendChild(ms);
    });
    box.appendChild(pc);
    const act=el("div","btns");
    if(!M.scored){
      const warn=el("div","hint"); let armed=false;
      act.appendChild(btn("採点する","red",()=>{ const empty=Object.keys(T.cells).filter(k=>M.cells[k]==null).length;
        if(empty && !armed){ armed=true; warn.style.color="var(--red)"; warn.textContent=`まだ ${empty} マス空いています。このまま採点するなら、もう一度「採点する」を押す（採点は1回だけ）。`; return; }
        const r=score(M.cells); M.scored=true; M.score=r.score; M.wrong=r.wrong; M.sec=Math.round((Date.now()-M.started)/1000); M.over=M.sec*1000>LIM?1:0; M.first=Object.assign({},M.cells); save(); touch(); render(); updBar(); if(window._fix) window._fix(); }));
      act.appendChild(warn);
    }
    box.appendChild(act);
    if(M.scored) box.appendChild(resultCard());
    startTick();
  };
  const markRow=(cn)=>{
    const row=el("div","mrow"); row.appendChild(el("span","mk",cn));
    const opts = T.choice_cells.includes(cn) ? T.choices[cn].map((_,i)=>[String(i),NUMS[i]]) : [["-","−"]].concat("0123456789".split("").map(x=>[x,x]));
    const locked = M.scored && !M.redo;
    opts.forEach(([v,lab])=>{ const b=el("button","bub"+(M.cells[cn]===v?" on":""),lab); b.type="button"; b.setAttribute("aria-label",cn+" "+lab); b.disabled=locked;
      b.addEventListener("click",()=>{ M.cells[cn] = M.cells[cn]===v ? null : v; save(); touch(); row.querySelectorAll(".bub").forEach(z=>z.classList.toggle("on", z===b && M.cells[cn]===v)); }); row.appendChild(b); });
    if(M.scored && !M.redo) row.classList.add(M.cells[cn]===T.cells[cn]?"ok":"ng");
    return row;
  };
  const resultCard=()=>{
    const c=el("div","result"), line=T.line;
    c.innerHTML=`<div class="big">${M.score}<small> / ${T.max}点</small></div><div>${M.score>=line?`8割ライン（${line}点）クリア！`:`8割ライン（${line}点）まであと ${line-M.score} 点`}　${Math.floor(M.sec/60)}分${M.sec%60}秒${M.over?"（時間切れ）":""}</div>`+
      (M.redoScore!=null?`<div class="hint">解き直しの得点：${M.redoScore}点（記録は1回目の ${M.score}点）</div>`:"");
    const ol=el("div","olist"); T.units.forEach(u=>{ const ok=u.cells.every(k=>M.first[k]===T.cells[k]); ol.appendChild(el("span",ok?"ok":"ng",(ok?"○ ":"× ")+u.cells.join(""))); }); c.appendChild(ol);
    c.appendChild(el("div","hint","× の問題は ③直し でヒントから順に開こう。"));
    c.appendChild(el("div","signs",T.flow)); c.appendChild(el("div","signs",T.stumble));
    const bb=el("div","btns");
    bb.appendChild(btn(M.redo?"解き直しを採点":"解き直す","ghost",()=>{ if(!M.redo){ M.redo=true; M.cells={}; } else { const r=score(M.cells); M.redoScore=Math.max(M.redoScore||0,r.score); M.redo=false; M.cells=Object.assign({},M.first); } save(); touch(); render(); }));
    c.appendChild(bb); return c;
  };
  render(); return d;
}
function startTick(){
  stopTick();
  const upd=()=>{ const t=document.getElementById("tmr"), m=document.getElementById("tmsg"); if(!t||!cur){ stopTick(); return; }
    const M=st(cur.id).mk, LIM=cur.main.minutes*60000; const e=(M.scored?M.sec*1000:Date.now()-M.started), rest=LIM-e;
    t.textContent = rest>=0 ? fmt(rest) : "+"+fmt(rest);
    m.textContent = M.scored ? "採点ずみ" : rest>=0 ? "のこり時間" : "時間切れ。区切りをつけて採点しよう"; };
  upd(); tick=setInterval(upd,1000);
}

/* ---------- ③ 直し（ヒント1 → ヒント2 → 解説） ---------- */
function renderFix(box){
  box.innerHTML=""; const s=st(cur.id), M=s.mk, T=cur.main;
  if(!M.scored){ box.appendChild(el("div","card","<span class=\"hint\">② を採点すると、ここに直しが出ます。</span>")); return; }
  const c=el("div","card");
  c.appendChild(el("div","hint","× の問題は、いきなり解説を見ない。ヒント1 → 考える → ヒント2 → 考える → 解説 の順。わかったら ② の「解き直す」でマークし直そう。"));
  T.units.forEach((u,i)=>{
    const ok=u.cells.every(k=>M.first[k]===T.cells[k]); const ans=u.show||u.cells.map(cellShow).join("");
    const d=el("div","unit"); d.appendChild(el("div","h",`<span class="${ok?"ok":"ng"}">${ok?"○":"×"}</span>${u.part} ${u.cells.map(k=>'<span class="mk">'+k+'</span>').join("")}<span style="margin-left:auto;font-weight:400">${u.pt}点</span>`));
    const lad=el("div","ladder"); d.appendChild(lad);
    const draw=()=>{ lad.innerHTML=""; const lv=s.fix.lv[i]||0;
      if(ok && lv<3){ lad.appendChild(btn("解説を見る","ghost sm",()=>{ s.fix.lv[i]=3; save(); touch(); draw(); })); return; }
      if(lv>=1) lad.appendChild(el("div","h1","<b>ヒント1</b>　"+u.h1));
      if(lv>=2) lad.appendChild(el("div","h2","<b>ヒント2</b>　"+u.h2));
      if(lv>=3) lad.appendChild(el("div","exb",`<b>正解 ${ans}</b>　${u.ex}`));
      if(lv<3) lad.appendChild(btn(["ヒント1を見る","ヒント2を見る","解説を見る"][lv],"ghost sm",()=>{ s.fix.lv[i]=lv+1; save(); touch(); draw(); }));
      if(!ok){ const k=ukey(u); lad.appendChild(el("div","hint","このミスの種類は？"));
        const chs=el("div","chips"); MISS.forEach(m=>{ const b=el("button","chip"+(s.fix.miss[k]===m?" on":""),m); b.type="button";
          b.addEventListener("click",()=>{ s.fix.miss[k] = s.fix.miss[k]===m ? undefined : m; if(!s.fix.miss[k]) delete s.fix.miss[k]; save(); touch(); chs.querySelectorAll(".chip").forEach(z=>z.classList.toggle("on", z.textContent===s.fix.miss[k])); updBar(); }); chs.appendChild(b); });
        lad.appendChild(chs); }
    };
    draw(); c.appendChild(d);
  });
  box.appendChild(c);
}
function reflBox(){
  const s=st(cur.id), R=s.refl; const w=el("div");
  const ta=(k,q)=>{ const c=el("div","card"); c.appendChild(el("div","q",q)); const t=el("textarea"); t.value=R[k]||""; t.addEventListener("input",()=>{ R[k]=t.value; save(); touch(); }); c.appendChild(t); return c; };
  w.append(ta("next","次に同じ型が出たら、最初に何をする？（ひとこと）"), ta("unclear","まだわからないこと（なければ「なし」）"));
  const sd=el("div","send"); sd.appendChild(el("div","q","<b>先生に送る</b>")); const sum=el("div","sum"); sd.appendChild(sum);
  const rsum=()=>{ const x=stats(), M=s.mk; sum.innerHTML=`① ${x.done}/${x.total}（1回目で正解 ${x.first}）　② <b>${M.scored?M.score:"-"}</b>/${cur.main.max}点　ミス分類 ${Object.keys(s.fix.miss).length}/${(M.wrong||[]).length}`+(s.sentAt?`<br><span class="pill">送信済み ${s.sentAt}</span>（何回でも送り直せる）`:""); };
  rsum(); window._rsum=rsum;
  sendLink(sd, ()=>buildDayUrl(), ()=>{ s.sentAt=nowStr(); save(); setTimeout(rsum,50); }, "③ まで終わったら送ろう。");
  w.appendChild(sd); return w;
}
function sendLink(box, urlFn, onSent, note){
  if(!SUBMIT_URL){ box.appendChild(el("small",null,"送信先がまだ設定されていません（試作版）。")); return; }
  const a=el("a","btn","先生に送る"); a.target="_blank"; a.rel="noopener"; const warn=el("small");
  const ready=()=>S.name&&S.num;
  const upd=()=>{ if(ready()){ a.href=urlFn(); a.style.opacity=""; warn.textContent="新しいタブで「送信しました」と出たら完了。"+(note||""); } else { a.removeAttribute("href"); a.style.opacity=".4"; warn.textContent="もくじで、組・番号・名前を入れてから送ろう。"; } };
  a.addEventListener("pointerdown",upd); a.addEventListener("focus",upd);
  a.addEventListener("click",()=>{ upd(); if(!ready()) return; onSent(); });
  upd(); box.append(a,warn);
}
function stats(){ const s=st(cur.id); let done=0,first=0,shown=0,rv=0,rvok=0;
  cur.drill.forEach(it=>{ const r=s.items[it.id]; if(!r) return; if(r.ok) done++; if(r.first) first++; if(r.shown) shown++; });
  Object.entries(s.items).forEach(([k,r])=>{ if(k.startsWith("rv:")){ rv++; if(r.first) rvok++; } });
  return {done, first, shown, rv, rvok, total:cur.drill.length, minutes:Math.round((s.active||0)/60000)}; }
function q(p){ return SUBMIT_URL+"?"+Object.entries(p).map(([k,v])=>k+"="+encodeURIComponent(String(v==null?"":v).slice(0,600))).join("&"); }
function buildDayUrl(){
  const s=st(cur.id), x=stats(), M=s.mk, R=s.refl;
  const hints=Object.values(s.fix.lv).reduce((a,b)=>a+Math.min(b,2),0);
  return q({type:"day", id:cur.id, day:curDay, title:MASTER.find(u=>u.id===cur.id).title, cls:S.cls, num:S.num, name:S.name, sel:S.sel.map(k=>FIELDS[k]).join("・"),
    done:x.done, total:x.total, first:x.first, shown:x.shown, rv:x.rv?`${x.rvok}/${x.rv}`:"",
    score:M.scored?M.score:"", max:cur.main.max, sec:M.scored?M.sec:"", over:M.scored?M.over:"", wrong:(M.wrong||[]).join(" "), redo:M.redoScore!=null?M.redoScore:"",
    miss:Object.entries(s.fix.miss).map(([k,v])=>k+":"+v.replace(/（.*）/,"")).join(" "), hints, next:R.next, unclear:R.unclear, minutes:x.minutes, ver:APP_VER});
}

/* ---------- 通し演習 ---------- */
const SUBJ = {
  ia:{name:"数学Ⅰ，数学A", rows:[["第1問",30],["第2問",30],["第3問",20],["第4問",20]]},
  ii:{name:"数学Ⅱ，数学B，数学C", rows:[["第1問",15],["第2問",15],["第3問",22],["第4問",16,"選択"],["第5問",16,"選択"],["第6問",16,"選択"],["第7問",16,"選択"]]}
};
function openTest(no){
  stopTick(); page="test"; cur=null;
  const T=TESTS[no-1], s=tst(no);
  const a=document.getElementById("app"); a.innerHTML="";
  const bar=el("div","bar"); bar.append(btn("← もくじ","back",home), el("div","ttl",`通し演習${NUMS[no]}　${T.title}`)); bar.firstChild.className="back"; a.appendChild(bar);
  a.appendChild(el("div","goal","本番と同じ順に、ⅠA 70分 → 休けい → ⅡBC 70分。終わったら自己採点して、大問ごとの得点と使った時間を入れる。"));
  a.appendChild(el("div","card",`<b>やり方</b><ol style="margin:4px 0 0;padding-left:1.3em"><li>下のリンクから問題を開く（印刷すると本番に近い）。</li><li>タイマーをスタートして70分。答えは紙にメモする。</li><li>正解のページで自己採点。大問ごとに得点と時間を入れる。</li><li>下の「時間配分テンプレ」と比べて、ふりかえる。</li></ol><div class="hint">問題は大学入試センターが公開しているものです。アプリには載せていません。</div>`));
  ["ia","ii"].forEach(k=>{
    const X=SUBJ[k], L=T[k], d=sec(k==="ia"?"数学①":"数学②", k==="ia"?"--ia":"--ii", X.name);
    const c=el("div","card");
    const lk=el("div","btns"); lk.innerHTML=`<a class="btn sm" href="${L.q}" target="_blank" rel="noopener">問題のページ</a><a class="btn ghost sm" href="${L.a}" target="_blank" rel="noopener">正解のページ</a>`; c.appendChild(lk);
    if(L.note) c.appendChild(el("div","hint",L.note));
    const tm=el("div","timer",`<div class="t" id="tm_${k}">70:00</div><div class="msg" id="tmm_${k}">未スタート</div>`); tm.style.position="static"; tm.style.marginTop="10px";
    const sb=btn(s[k].start?"リセット":"70分 スタート","red sm",()=>{ s[k].start = s[k].start ? 0 : Date.now(); save(); openTest(no); }); tm.appendChild(sb); c.appendChild(tm);
    const tb=el("table","sc"); tb.innerHTML=`<tr><th>大問</th><th>配点</th><th>得点</th><th>時間(分)</th></tr>`;
    const tot=el("div","tot");
    const calc=()=>{ let sum=0, sel=0; X.rows.forEach(([n,p,opt])=>{ const v=num(s[k].p[n]); if(!isNaN(v)){ sum+=v; if(opt) sel++; } });
      tot.innerHTML=`合計 ${sum} / 100 点`+(sum>=80?`　<span class="pill">8割クリア</span>`:`　<span class="hint">8割まであと ${80-sum} 点</span>`)+(k==="ii"&&sel>3?`<div class="hint" style="color:var(--red)">選択問題は3問だけ入れる（いま ${sel} 問）</div>`:""); };
    X.rows.forEach(([n,p,opt])=>{ const tr=el("tr"); tr.innerHTML=`<td>${n}${opt?'<span class="hint">（選択）</span>':""}</td><td class="n">${p}</td>`;
      ["p","t"].forEach(f=>{ const td=el("td"); const inp=el("input"); inp.inputMode="numeric"; inp.value=s[k][f][n]||""; inp.setAttribute("aria-label",n+(f==="p"?" 得点":" 時間"));
        inp.addEventListener("input",()=>{ if(inp.value==="") delete s[k][f][n]; else s[k][f][n]=inp.value; save(); calc(); }); td.appendChild(inp); tr.appendChild(td); });
      tb.appendChild(tr); });
    c.append(tb, tot); calc();
    if(k==="ii") c.appendChild(el("div","hint","第4〜7問は、選んだ3問だけ入れる。2025・2026年は 第4問 数列／第5問 統計的な推測／第6問 ベクトル／第7問 複素数平面と曲線 の順でした。"));
    d.appendChild(c); a.appendChild(d);
  });
  const tp=sec("ふりかえり","--t3","時間配分テンプレと比べる"); tp.appendChild(el("div","card tpl",TEMPLATE));
  const ta=(f,qq)=>{ const c=el("div","card"); c.appendChild(el("div","q",qq)); const t=el("textarea"); t.value=s[f]||""; t.addEventListener("input",()=>{ s[f]=t.value; save(); }); c.appendChild(t); return c; };
  tp.append(ta("note","時間配分で、次に変えること"), ta("note2","落とした典型問題（どの大問のどこ？）"));
  const sd=el("div","send"); sd.appendChild(el("div","q","<b>先生に送る</b>"));
  if(s.sentAt) sd.appendChild(el("div","sum",`<span class="pill">送信済み ${s.sentAt}</span>`));
  sendLink(sd, ()=>{ const p={type:"test", no, title:T.title, cls:S.cls, num:S.num, name:S.name, sel:S.sel.map(k=>FIELDS[k]).join("・"), note:s.note, note2:s.note2, ver:APP_VER};
    ["ia","ii"].forEach(k=>{ let sum=0; SUBJ[k].rows.forEach(([n])=>{ const v=num(s[k].p[n]); if(!isNaN(v)) sum+=v; }); p[k+"_total"]=sum;
      p[k+"_detail"]=SUBJ[k].rows.filter(([n])=>s[k].p[n]!=null||s[k].t[n]!=null).map(([n])=>`${n}:${s[k].p[n]??"-"}点/${s[k].t[n]??"-"}分`).join(" "); }); return q(p); },
    ()=>{ s.sentAt=nowStr(); save(); }, "");
  tp.appendChild(sd); a.appendChild(tp);
  // タイマー
  const upd=()=>{ ["ia","ii"].forEach(k=>{ const t=document.getElementById("tm_"+k), m=document.getElementById("tmm_"+k); if(!t) return; const st0=s[k].start; if(!st0) return; const rest=4200000-(Date.now()-st0); t.textContent= rest>=0?fmt(rest):"+"+fmt(rest); m.textContent= rest>=0?"のこり時間":"時間切れ"; }); };
  upd(); tick=setInterval(upd,1000);
  fab(); window.scrollTo(0,0);
}

/* ---------- 質問する ---------- */
function fab(){
  let f=document.querySelector(".fab"); if(f) f.remove();
  f=el("button","fab","？ 質問する"); f.type="button"; f.addEventListener("click",askQ); document.body.appendChild(f);
}
function askQ(){
  const m=el("div","modal"); const inn=el("div","in"); m.appendChild(inn);
  m.addEventListener("click",e=>{ if(e.target===m) m.remove(); });
  inn.appendChild(el("h3",null,"先生に質問する"));
  const where=el("select");
  let opts=["全体・その他"];
  if(page==="day"&&cur){ opts=[`Day ${curDay} ① 道具`].concat(cur.main.units.map(u=>`Day ${curDay} ② ${u.part} ${u.cells.join("")}`), [`Day ${curDay} ③ 直し`, "全体・その他"]); }
  if(page==="test") opts=["通し演習（大問番号も書いてね）","全体・その他"];
  opts.forEach(o=>{ const op=el("option",null,o); op.value=o; where.appendChild(op); });
  inn.append(el("label",null,"どこについて？"), where);
  const t=el("textarea"); t.placeholder="どこまでわかって、どこからわからないかを書くと答えやすい。"; inn.append(el("label",null,"質問"), t);
  const box=el("div","btns"); inn.appendChild(box);
  sendLink(box, ()=>q({type:"q", where:where.value, id:cur?cur.id:"", cls:S.cls, num:S.num, name:S.name, text:t.value, ver:APP_VER}), ()=>{ setTimeout(()=>m.remove(),300); }, "");
  box.appendChild(btn("閉じる","ghost sm",()=>m.remove()));
  document.body.appendChild(m); t.focus();
}
